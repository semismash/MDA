name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

      # Keep the signoff and routing reports even when the build fails (DRC, congestion, area and timing numbers).
      # Download them from the "Artifacts" section at the bottom of the run page.
      - name: Keep the DRC and routing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            runs/wokwi/*-klayout-drc/
            runs/wokwi/*/reports/
            runs/wokwi/final/metrics.json
            runs/wokwi/final/metrics.csv
            !**/*.gds
            !**/*.odb
            !**/*.def
          retention-days: 14
          if-no-files-found: ignore

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l